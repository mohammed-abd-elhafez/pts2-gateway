# One small server: the gateway and its database. Put a TLS reverse proxy (Caddy, nginx) in front of port 8080.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16.15
    restart: unless-stopped
    environment:
      POSTGRES_DB: pts2
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pts2"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/pts2
      PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CAPTURE_REPLY_BODY: ${CAPTURE_REPLY_BODY:-{"ok":true}}
      NEGATIVE_CONSUMED_POLICY: ${NEGATIVE_CONSUMED_POLICY:-allow}
      QUANTITY_DECIMALS: ${QUANTITY_DECIMALS:-2}
      BODY_LIMIT_BYTES: ${BODY_LIMIT_BYTES:-20971520}
      CAPTURE_REPLY_STATUS: ${CAPTURE_REPLY_STATUS:-200}
      DB_CONNECTION_TIMEOUT_MS: ${DB_CONNECTION_TIMEOUT_MS:-5000}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-60000}
      DB_LOCK_TIMEOUT_MS: ${DB_LOCK_TIMEOUT_MS:-10000}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    # exec: node becomes PID 1 and receives SIGTERM, so shutdown is graceful
    command: ["sh", "-c", "node dist/scripts/migrate.js && exec node dist/src/server.js"]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    logging: *logging
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  pgdata:
